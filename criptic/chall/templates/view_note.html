<!DOCTYPE html>
<html>
<head>
    <title>{{ note.title }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .note-header { margin-bottom: 20px; }
        .note-meta { color: #666; font-size: 0.8em; margin: 10px 0; }
        .note-content { white-space: pre-line; line-height: 1.6; }
        .btn { padding: 8px 12px; background: #4CAF50; color: white; text-decoration: none; border-radius: 4px; }
        .btn-danger { background: #f44336; }
    </style>
</head>
<body>
    <div class="container">
        <div class="note-header">
            <h1>{{ note.title }}</h1>
            <div class="note-meta">Created on {{ note.timestamp }}</div>
        </div>
        
        <div class="note-content">
            {{ note.content }}
        </div>
        
        <div style="margin-top: 30px;">
            <a href="{{ url_for('index') }}" class="btn">Back to Notes</a>
            <a href="{{ url_for('delete_note', note_id=note.id) }}" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this note?')">Delete</a>
        </div>
    </div>
</body>
</html>
